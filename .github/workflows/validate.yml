name: Validate Learning App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check live runtime syntax
        run: |
          node --check sakhi-v2.js
          node --check presentation-theme.js
      - name: Run live V2 regression suite
        run: node --test tests/v2.test.cjs
