name: Validate Learning App

on:
  push:
    branches: [main, sakhi-production-v3, sakhi-v3-cloud-auth]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Sakhi V3 runtime syntax
        run: |
          node --check sakhi-v3.js
          node --check cloud-auth-v3.js
      - name: Run Sakhi V3 production regression suite
        run: node --test tests/v3.test.cjs
